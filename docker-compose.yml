services:
  db:
    image: postgres:16-alpine
    container_name: shortlink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortlink_db
      POSTGRES_USER: shortlink_user
      POSTGRES_PASSWORD: shortlink_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink_user -d shortlink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortlink_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local